version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: deployflow_db
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deployflow_network

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: deployflow_server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost
      - MONGODB_URI=mongodb://mongodb:27017/deployflow
      - JWT_SECRET=deployflow_dev_super_secret_jwt_key_change_in_production_2026
      - JWT_EXPIRES_IN=7d
      - COOKIE_SECRET=deployflow_cookie_signing_secret_key_2026
      - ADMIN_EMAIL=admin@deployflow.io
      - ADMIN_PASSWORD=AdminSecurePass123!
      - ADMIN_NAME=System Administrator
      - MAX_REQUESTS_PER_MINUTE=100
    networks:
      - deployflow_network

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: deployflow_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'
    networks:
      - deployflow_network

volumes:
  mongo_data:
    driver: local

networks:
  deployflow_network:
    driver: bridge
